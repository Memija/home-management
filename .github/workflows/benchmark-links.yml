name: Benchmark Source Links Validation

on:
  schedule:
    - cron: '0 7 1 * *' # 1st of every month at 07:00 UTC
  workflow_dispatch:
    inputs:
      strict_warnings:
        description: 'Fail on WAF 403 / geo-timeout warnings in addition to 404/410/ENOTFOUND'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-links:
    name: Check Official Benchmark URLs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate Benchmark Source Links
        env:
          STRICT_WARNINGS: ${{ inputs.strict_warnings }}
        run: |
          if [ "$STRICT_WARNINGS" = "true" ]; then
            node scripts/check-benchmark-links.mjs --strict --json benchmark-links-report.json
          else
            node scripts/check-benchmark-links.mjs --json benchmark-links-report.json
          fi

      - name: Upload Link Audit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-links-report
          path: benchmark-links-report.json
          retention-days: 7
