name: OWASP ZAP Baseline DAST Scan

on:
  schedule:
    - cron: '0 5 * * 0' # Every Sunday at 5:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan:
    name: OWASP ZAP Baseline Penetration Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://home-management.dev'
          issue_title: 'OWASP ZAP: Security Finding in Deployed App'
          fail_action: false

      - name: Generate OWASP ZAP Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🌐 OWASP ZAP Dynamic Application Security Testing (DAST)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ Baseline Penetration Scan Completed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Target URL** | \`https://home-management.dev\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Scan Type** | Baseline DAST / Passive Scan |" >> $GITHUB_STEP_SUMMARY
            echo "| **Fail on Alert** | Disabled (\`fail_action: false\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | Passed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> Dynamic scans test the live application for missing security headers, cookie flags, and exposed metadata. Any actionable findings create an automated GitHub issue." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ OWASP ZAP Scan Failed or Encountered Errors" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review job logs for details on connection or scan failures." >> $GITHUB_STEP_SUMMARY
          fi
