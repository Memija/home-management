name: Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project
        run: npm run build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_RECAPTCHA_SITE_KEY: ${{ secrets.FIREBASE_RECAPTCHA_SITE_KEY }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-dist-artifact
          path: dist/home-management/
          retention-days: 1

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 📦 Lighthouse CI: Application Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Build Succeeded for Lighthouse Auditing" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Distribution Path** | \`dist/home-management/\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Artifact Name** | \`lighthouse-dist-artifact\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | Ready for parallel matrix audit (\`desktop\`, \`mobile\`) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Application Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check build logs for Angular compilation errors." >> $GITHUB_STEP_SUMMARY
          fi

  lighthouse:
    name: Lighthouse Audit (${{ matrix.preset }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download Build Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lighthouse-dist-artifact
          path: dist/home-management/

      - name: Run Lighthouse (${{ matrix.preset }})
        run: npm run test:lighthouse:${{ matrix.preset }}

      - name: Upload Lighthouse Report (${{ matrix.preset }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-report-${{ matrix.preset }}
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate Lighthouse Summary (${{ matrix.preset }})
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const preset = "${{ matrix.preset }}";
            let md = `## ⚡ Lighthouse CI Audit (\`${preset.toUpperCase()}\`)\n\n`;
            try {
              if (fs.existsSync(".lighthouseci/manifest.json")) {
                const manifest = JSON.parse(fs.readFileSync(".lighthouseci/manifest.json", "utf8"));
                md += "### ✅ Audit Completed Successfully!\n\n";
                md += "| Route | Performance | Accessibility | Best Practices | SEO |\n";
                md += "| :--- | :--- | :--- | :--- | :--- |\n";
                for (const run of manifest) {
                  const url = run.url.replace(/^http:\/\/[^/]+/, "") || "/";
                  const perf = run.summary ? Math.round(run.summary.performance * 100) : "N/A";
                  const a11y = run.summary ? Math.round(run.summary.accessibility * 100) : "N/A";
                  const bp = run.summary ? Math.round(run.summary["best-practices"] * 100) : "N/A";
                  const seo = run.summary ? Math.round(run.summary.seo * 100) : "N/A";
                  md += `| \`${url}\` | ${perf}% | ${a11y}% | ${bp}% | ${seo}% |\n`;
                }
                md += "\n> [!TIP]\n> Detailed HTML reports with interactive traces and audits are saved in the `lighthouse-report-" + preset + "` artifact.\n";
              } else {
                md += "| Metric | Status |\n";
                md += "| :--- | :--- |\n";
                md += "| **Device Preset** | `" + preset + "` |\n";
                md += "| **Audit Status** | ${{ job.status == "success" && "✅ Audit Passed" || "⚠️ Audit Completed with Warnings/Failures" }} |\n";
              }
            } catch (err) {
              md += "| Metric | Status |\n";
              md += "| :--- | :--- |\n";
              md += "| **Device Preset** | `" + preset + "` |\n";
              md += "| **Audit Status** | ${{ job.status == "success" && "✅ Audit Passed" || "⚠️ Audit Completed" }} |\n";
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
