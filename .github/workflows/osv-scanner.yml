name: Google OSV Supply Chain Scanner

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6:00 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: Google OSV Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Google OSV Scanner
        uses: google/osv-scanner-action/v1@main
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
            --output=osv-results.sarif

      - name: Upload OSV Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'osv-results.sarif'
