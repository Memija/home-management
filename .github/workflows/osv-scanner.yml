name: Google OSV Supply Chain Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6:00 AM UTC
  workflow_dispatch:

permissions: read-all

jobs:
  osv-scan:
    name: OSV PR Scan
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --config=osv-scanner.toml

  scan-repository:
    name: OSV Full Repository Scan
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --config=osv-scanner.toml
      fail-on-vuln: false

  summary:
    name: Generate Scan Summary
    needs: [osv-scan, scan-repository]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (needs.osv-scan.result == 'success' || needs.osv-scan.result == 'failure' || needs.scan-repository.result == 'success' || needs.scan-repository.result == 'failure')
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download SARIF Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OSV Scanner SARIF file
          path: sarif-results/

      - name: Generate Job Summary
        run: node scripts/generate-osv-summary.js sarif-results
