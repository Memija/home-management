name: Generate Software Bill of Materials (SBOM)

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SPDX & CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: cyclonedx.sbom.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: spdx.sbom.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: software-bill-of-materials
          path: |
            cyclonedx.sbom.json
            spdx.sbom.json
          retention-days: 90

      - name: Generate SBOM Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let md = "## 📦 Software Bill of Materials (SBOM) Report\n\n";
            let cdxCount = 0;
            let spdxCount = 0;

            try {
              if (fs.existsSync("cyclonedx.sbom.json")) {
                const cdx = JSON.parse(fs.readFileSync("cyclonedx.sbom.json", "utf8"));
                cdxCount = (cdx.components && cdx.components.length) || 0;
              }
              if (fs.existsSync("spdx.sbom.json")) {
                const spdx = JSON.parse(fs.readFileSync("spdx.sbom.json", "utf8"));
                spdxCount = (spdx.packages && spdx.packages.length) || 0;
              }
              md += "### ✅ SBOM Generation Successful!\n\n";
              md += "| Format | File | Components Documented |\n";
              md += "| :--- | :--- | :--- |\n";
              md += `| **CycloneDX** (\`json\`) | \`cyclonedx.sbom.json\` | \`${cdxCount}\` packages |\n`;
              md += `| **SPDX** (\`json\`) | \`spdx.sbom.json\` | \`${spdxCount}\` packages |\n\n`;
              md += "> [!TIP]\n";
              md += "> Download the **software-bill-of-materials** artifact for full dependency metadata, licenses, and hashes (Retained for 90 days).\n";
            } catch (err) {
              md += "### ✅ SBOM Artifacts Produced\n\nGenerated CycloneDX and SPDX manifests.\n";
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
