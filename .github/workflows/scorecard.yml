name: OpenSSF Scorecard Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 6' # Weekly on Saturday at 1:30 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard Evaluation
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          sarif_file: scorecard-results.sarif

      - name: Generate Scorecard Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🏆 OpenSSF Scorecard Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ Security Posture Evaluation Completed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Framework** | [OpenSSF Scorecard](https://scorecard.dev) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Format** | SARIF 2.1.0 |" >> $GITHUB_STEP_SUMMARY
            echo "| **Security Tab Sync** | ✅ Synced to Code Scanning |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> Scorecard evaluates supply-chain security hygiene, dependency pinning, and workflow hardening." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ OpenSSF Scorecard Evaluation Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review job logs for details." >> $GITHUB_STEP_SUMMARY
          fi
