name: Socket.dev Supply Chain Security

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket:
    name: Socket Dependency Malware & Threat Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Socket Firewall & Scan
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies with Socket Firewall
        run: npm ci --legacy-peer-deps

      - name: Generate Socket Security Summary
        if: always()
        run: |
          echo "## 🛡️ Socket.dev Supply Chain Security" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ All Clear — No Supply Chain Threats Detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Protected File** | \`package-lock.json\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Mode** | Socket Firewall & Threat Detection |" >> $GITHUB_STEP_SUMMARY
            echo "| **Result** | Passed — All dependencies verified safe |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> Dependencies were monitored for malicious scripts, typosquatting, telemetry, and environment variable access." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Supply Chain Threat Detected by Socket!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Inspect the job output for malicious or flagged packages." >> $GITHUB_STEP_SUMMARY
          fi
