# uuid: Transitive dev dependency in sockjs and @lhci/cli
# Vulnerability only affects v3/v5/v6 when custom buffer is passed with offset; dev tools only invoke uuid.v4().
[[IgnoredVulns]]
id = "CVE-2026-41907"
reason = "Dev-only dependency in sockjs and @lhci/cli; vulnerable buffer APIs are never invoked (only uuid.v4 is called)."

