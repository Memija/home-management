<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found | Home Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family:
          'Inter',
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        max-width: 30rem;
        width: 100%;
        text-align: center;
        padding: 2.5rem 2rem;
        border-radius: 1rem;
        background: #1e293b;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }
      .code {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        background: rgba(45, 212, 191, 0.14);
        color: #2dd4bf;
        font-weight: 700;
        font-size: 0.875rem;
        letter-spacing: 0.06em;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1.75rem;
        color: #94a3b8;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 1.25rem;
        border-radius: 0.6rem;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }
      a.primary {
        background: linear-gradient(135deg, #0d9488, #0284c7);
        color: #ffffff;
      }
      a.secondary {
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #e2e8f0;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="code">404</span>
      <h1>Page Not Found</h1>
      <p>The requested resource does not exist or has been moved.</p>
      <div class="actions">
        <a class="primary" href="/">Back to Home</a>
        <a class="secondary" href="/dashboard">Open Dashboard</a>
      </div>
    </main>
  </body>
</html>
