<div class="language-switcher-container">
  <div class="dropdown">
    <button
      type="button"
      class="dropdown-trigger"
      (click)="toggleDropdown()"
      title="{{ 'LANGUAGE.CHOOSE' | translate }}"
      aria-label="{{ currentLangUpper() + ' - ' + ('LANGUAGE.CHOOSE' | translate) }}"
    >
      <div class="flag-wrapper" aria-hidden="true">
        <img [src]="currentFlagSrc()" alt="" class="flag-icon" />
      </div>
      <span class="current-lang">{{ currentLangUpper() }}</span>
      <lucide-icon
        [img]="ChevronDownIcon"
        size="14"
        class="chevron"
        [class.open]="isDropdownOpen()"
        aria-hidden="true"
      ></lucide-icon>
    </button>

    <div class="dropdown-menu" [class.show]="isDropdownOpen()" role="menu">
      @for (opt of languageOptions; track opt.code) {
        <button
          type="button"
          class="dropdown-item"
          [class.active]="languageService.currentLang() === opt.code"
          (click)="selectLanguage(opt.code)"
          role="menuitem"
          [title]="opt.name"
        >
          <div class="lang-title">
            <div class="flag-wrapper small" aria-hidden="true">
              <img [src]="opt.flagSrc" alt="" class="flag-icon" loading="lazy" />
            </div>
            <span class="lang-name">{{ opt.name }}</span>
          </div>
          @if (languageService.currentLang() === opt.code) {
            <lucide-icon
              [img]="CheckIcon"
              size="16"
              class="check-icon"
              aria-hidden="true"
            ></lucide-icon>
          }
        </button>
      }
    </div>
  </div>
</div>
