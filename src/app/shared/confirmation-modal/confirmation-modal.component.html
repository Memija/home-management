@if (show) {
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- Backdrop dismissal by design -->
  <div class="modal-overlay" (click)="onCancel()" (keydown.escape)="onCancel()">
    <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- Container stopPropagation by design -->
    <div
      class="modal-content"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <lucide-icon [img]="icon" size="32" class="info-icon"></lucide-icon>
        <h3>{{ titleKey | translate }}</h3>
        <button
          type="button"
          class="close-btn"
          (click)="onCancel()"
          title="{{ 'ACTIONS.CLOSE' | translate }}"
          aria-label="{{ 'ACTIONS.CLOSE' | translate }}"
        >
          &times;
        </button>
      </div>
      <div class="modal-body">
        <p>{{ translatedMessage() }}</p>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn-secondary"
          (click)="onCancel()"
          title="{{ cancelKey | translate }}"
          aria-label="{{ cancelKey | translate }}"
        >
          {{ cancelKey | translate }}
        </button>
        <button
          type="button"
          class="btn-primary"
          (click)="onConfirm()"
          title="{{ confirmKey | translate }}"
          aria-label="{{ confirmKey | translate }}"
        >
          {{ confirmKey | translate }}
        </button>
      </div>
    </div>
  </div>
}
