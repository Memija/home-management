<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- Backdrop dismissal by design -->
<div class="modal-overlay" (click)="onClose()" (keydown.escape)="onClose()">
  <div
    class="modal-container"
    role="dialog"
    aria-modal="true"
    aria-labelledby="contact-modal-title"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <h2 id="contact-modal-title">{{ 'CONTACT.TITLE' | translate }}</h2>
      <div class="header-actions">
        <button
          type="button"
          class="help-btn"
          (click)="showHelpModal.set(true)"
          title="{{ 'CONTACT.HELP_TITLE' | translate }}"
          aria-label="{{ 'CONTACT.HELP_TITLE' | translate }}"
        >
          <lucide-icon [img]="HelpIcon" size="20"></lucide-icon>
        </button>
        <button
          type="button"
          class="close-btn"
          (click)="onClose()"
          title="{{ 'ACTIONS.CLOSE' | translate }}"
          aria-label="{{ 'ACTIONS.CLOSE' | translate }}"
        >
          <lucide-icon [img]="XIcon" size="24"></lucide-icon>
        </button>
      </div>
    </div>

    <div class="modal-body">
      <form (ngSubmit)="onCompose()">
        <div class="form-group">
          <label for="contact-name">{{ 'CONTACT.NAME' | translate }}</label>
          <input
            type="text"
            id="contact-name"
            name="name"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            [placeholder]="'CONTACT.NAME_PLACEHOLDER' | translate"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="contact-email">{{ 'CONTACT.EMAIL' | translate }}</label>
          <input
            type="email"
            id="contact-email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="onEmailChange($event)"
            [placeholder]="'CONTACT.EMAIL_PLACEHOLDER' | translate"
            [class.invalid]="emailError()"
            autocomplete="email"
            required
          />
          @if (emailError()) {
            <div class="error-message">
              <lucide-icon [img]="TriangleAlertIcon" size="16" class="error-icon"></lucide-icon>
              <span>{{ 'CONTACT.INVALID_EMAIL' | translate }}</span>
            </div>
          }
        </div>

        <div class="form-group">
          <label for="contact-subject">{{ 'CONTACT.SUBJECT' | translate }}</label>
          <input
            type="text"
            id="contact-subject"
            name="subject"
            [ngModel]="subject()"
            (ngModelChange)="subject.set($event)"
            [placeholder]="'CONTACT.SUBJECT_PLACEHOLDER' | translate"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-group">
          <label for="contact-message">{{ 'CONTACT.MESSAGE' | translate }}</label>
          <textarea
            id="contact-message"
            name="message"
            rows="8"
            [ngModel]="message()"
            (ngModelChange)="message.set($event)"
            [placeholder]="'CONTACT.MESSAGE_PLACEHOLDER' | translate"
            autocomplete="off"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <div class="custom-select dropup">
            <button
              type="button"
              class="select-trigger"
              (click)="toggleDropdown()"
              title="{{ 'CONTACT.EMAIL_CLIENT' | translate }}"
              [attr.aria-label]="'CONTACT.EMAIL_CLIENT' | translate"
              [attr.aria-expanded]="dropdownOpen() ? 'true' : 'false'"
              aria-haspopup="true"
              aria-controls="email-client-dropdown"
            >
              <div class="select-content">
                @if (emailClient() === 'default') {
                  <lucide-icon [img]="LaptopIcon" size="20"></lucide-icon>
                } @else if (emailClient() === 'outlook') {
                  <img src="/assets/outlook_logo.png" alt="Outlook" class="logo-icon" />
                } @else if (emailClient() === 'gmail') {
                  <img src="/assets/gmail_logo.png" alt="Gmail" class="logo-icon" />
                }
                <span>
                  @if (emailClient() === 'default') {
                    {{ 'CONTACT.DEFAULT_CLIENT' | translate }}
                  } @else {
                    {{ getClientLabel(emailClient()) }}
                  }
                </span>
              </div>
              <lucide-icon
                [img]="ChevronDownIcon"
                size="16"
                class="chevron"
                [style.transform]="dropdownOpen() ? 'rotate(180deg)' : 'rotate(0deg)'"
              ></lucide-icon>
            </button>
            <div class="dropdown-menu" id="email-client-dropdown" [hidden]="!dropdownOpen()">
              <button
                type="button"
                class="dropdown-item"
                [class.selected]="emailClient() === 'default'"
                (click)="selectEmailClient('default'); $event.stopPropagation()"
              >
                <lucide-icon [img]="LaptopIcon" size="20"></lucide-icon>
                <span>{{ 'CONTACT.DEFAULT_CLIENT' | translate }}</span>
              </button>
              <button
                type="button"
                class="dropdown-item"
                [class.selected]="emailClient() === 'outlook'"
                (click)="selectEmailClient('outlook'); $event.stopPropagation()"
              >
                <img src="/assets/outlook_logo.png" alt="Outlook" class="logo-icon" />
                <span>Outlook</span>
              </button>
              <button
                type="button"
                class="dropdown-item"
                [class.selected]="emailClient() === 'gmail'"
                (click)="selectEmailClient('gmail'); $event.stopPropagation()"
              >
                <img src="/assets/gmail_logo.png" alt="Gmail" class="logo-icon" />
                <span>Gmail</span>
              </button>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button
            type="button"
            class="btn-secondary"
            (click)="onClose()"
            title="{{ 'CONTACT.CANCEL' | translate }}"
            aria-label="{{ 'CONTACT.CANCEL' | translate }}"
          >
            {{ 'CONTACT.CANCEL' | translate }}
          </button>
          <button
            type="submit"
            class="btn-primary"
            [disabled]="!name() || !email() || !subject() || !message() || emailError()"
            title="{{ 'CONTACT.SEND' | translate }}"
            aria-label="{{ 'CONTACT.SEND' | translate }}"
          >
            {{ 'CONTACT.SEND' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<app-help-modal
  [show]="showHelpModal()"
  [titleKey]="'CONTACT.HELP_TITLE'"
  [steps]="helpSteps"
  (closeModal)="showHelpModal.set(false)"
>
</app-help-modal>
