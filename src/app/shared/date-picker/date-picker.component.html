<div class="date-picker-container">
  <button
    type="button"
    class="input-wrapper"
    (click)="toggleCalendar()"
    [disabled]="disabled()"
    [class.disabled]="disabled()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="placeholder() | translate"
  >
    <lucide-icon [img]="CalendarIcon" size="18" class="calendar-icon"></lucide-icon>
    <span class="date-display" [class.placeholder]="!date()">
      {{ formattedDate() || (placeholder() | translate) }}
    </span>
  </button>

  @if (isOpen()) {
    <div class="calendar-popup">
      <div class="calendar-header">
        <button
          type="button"
          (click)="prevMonth()"
          class="nav-btn"
          title="Previous month"
          aria-label="Previous month"
        >
          <lucide-icon [img]="ChevronLeftIcon" size="20"></lucide-icon>
        </button>
        <span class="month-year">{{ currentMonthName() }}</span>
        <button
          type="button"
          (click)="nextMonth()"
          class="nav-btn"
          title="Next month"
          aria-label="Next month"
        >
          <lucide-icon [img]="ChevronRightIcon" size="20"></lucide-icon>
        </button>
      </div>

      <div class="calendar-grid">
        <div class="weekdays">
          @for (day of weekDays(); track $index) {
            <span class="weekday">{{ day }}</span>
          }
        </div>
        <div class="days">
          @for (cell of calendarCells(); track $index) {
            <button
              type="button"
              class="day-cell"
              [class.empty]="!cell.date"
              [class.selected]="cell.isSelected"
              [class.today]="cell.isToday"
              [class.sunday]="cell.isSunday"
              [class.disabled]="cell.isDisabled"
              [disabled]="cell.isDisabled"
              (click)="selectDate(cell.date)"
              [title]="cell.fullDateTitle"
            >
              {{ cell.dayNumber }}
            </button>
          }
        </div>
      </div>

      <div class="calendar-footer">
        <button
          type="button"
          class="btn-text"
          (click)="selectToday()"
          title="{{ 'CALENDAR.TODAY' | translate }}"
          aria-label="{{ 'CALENDAR.TODAY' | translate }}"
        >
          {{ 'CALENDAR.TODAY' | translate }}
        </button>
        <button
          type="button"
          class="btn-text danger"
          (click)="clearDate()"
          title="{{ 'CALENDAR.CLEAR' | translate }}"
          aria-label="{{ 'CALENDAR.CLEAR' | translate }}"
        >
          {{ 'CALENDAR.CLEAR' | translate }}
        </button>
      </div>
    </div>
  }
</div>
