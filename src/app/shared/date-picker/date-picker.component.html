<div class="date-picker-container">
  <div
    class="input-wrapper"
    (click)="toggleCalendar()"
    [class.disabled]="disabledSignal()"
    tabindex="0"
    (keyup.enter)="toggleCalendar()"
  >
    <lucide-icon [img]="CalendarIcon" size="18" class="calendar-icon"></lucide-icon>
    <span class="date-display" [class.placeholder]="!dateSignal()">
      {{ formattedDate() || (placeholderSignal() | translate) }}
    </span>
  </div>

  @if (isOpen()) {
    <div class="calendar-popup">
      <div class="calendar-header">
        <button
          type="button"
          (click)="prevMonth()"
          class="nav-btn"
          title="Previous month"
          aria-label="Previous month"
        >
          <lucide-icon [img]="ChevronLeftIcon" size="20"></lucide-icon>
        </button>
        <span class="month-year">{{ currentMonthName() }}</span>
        <button
          type="button"
          (click)="nextMonth()"
          class="nav-btn"
          title="Next month"
          aria-label="Next month"
        >
          <lucide-icon [img]="ChevronRightIcon" size="20"></lucide-icon>
        </button>
      </div>

      <div class="calendar-grid">
        <div class="weekdays">
          @for (day of weekDays(); track $index) {
            <span class="weekday">{{ day }}</span>
          }
        </div>
        <div class="days">
          @for (day of calendarDays(); track $index) {
            <button
              type="button"
              class="day-cell"
              [class.empty]="!day"
              [class.selected]="isSameDay(day, dateSignal())"
              [class.today]="isToday(day)"
              [class.sunday]="isSunday(day)"
              [class.disabled]="isDisabled(day)"
              [disabled]="!day || isDisabled(day)"
              (click)="selectDate(day)"
              title="{{ day ? (day | date: 'fullDate') : '' }}"
              aria-label="{{ day ? (day | date: 'fullDate') : '' }}"
            >
              {{ day?.getDate() }}
            </button>
          }
        </div>
      </div>

      <div class="calendar-footer">
        <button
          type="button"
          class="btn-text"
          (click)="selectToday()"
          title="{{ 'CALENDAR.TODAY' | translate }}"
          aria-label="{{ 'CALENDAR.TODAY' | translate }}"
        >
          {{ 'CALENDAR.TODAY' | translate }}
        </button>
        <button
          type="button"
          class="btn-text danger"
          (click)="clearDate()"
          title="{{ 'CALENDAR.CLEAR' | translate }}"
          aria-label="{{ 'CALENDAR.CLEAR' | translate }}"
        >
          {{ 'CALENDAR.CLEAR' | translate }}
        </button>
      </div>
    </div>
  }
</div>
