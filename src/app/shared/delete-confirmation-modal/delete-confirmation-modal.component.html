@if (show) {
  <div class="modal-overlay" (click)="onCancel()" tabindex="0" (keyup.enter)="onCancel()">
    <div
      class="modal-content"
      (click)="$event.stopPropagation()"
      tabindex="0"
      (keyup.enter)="$event.stopPropagation()"
    >
      <div class="modal-header">
        <lucide-icon [img]="icon" size="32" class="warning-icon"></lucide-icon>
        <h3>{{ titleKey | translate }}</h3>
        <button
          type="button"
          class="close-btn"
          (click)="onCancel()"
          title="{{ 'ACTIONS.CLOSE' | translate }}"
          aria-label="{{ 'ACTIONS.CLOSE' | translate }}"
        >
          &times;
        </button>
      </div>
      <div class="modal-body">
        <p>{{ translatedMessage() }}</p>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn-secondary"
          (click)="onCancel()"
          title="{{ cancelKey | translate }}"
          aria-label="{{ cancelKey | translate }}"
        >
          {{ cancelKey | translate }}
        </button>
        <button
          type="button"
          class="btn-danger"
          (click)="onConfirm()"
          title="{{ deleteKey | translate }}"
          aria-label="{{ deleteKey | translate }}"
        >
          {{ deleteKey | translate }}
        </button>
      </div>
    </div>
  </div>
}
