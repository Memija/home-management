@if (!seasonService.disabled()) {
  <svg
    [class]="'detailed-tree-svg season-' + season"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 2000 1200"
    preserveAspectRatio="xMidYMax slice"
    aria-hidden="true"
  >
    <defs>
      <!-- Organic leaf shapes -->
      <path id="leaf-0" d="M0,0 C-12,-8 -18,8 0,25 C18,8 12,-8 0,0 Z" />
      <path id="leaf-1" d="M0,0 C-10,-12 8,-18 20,0 C8,18 -10,12 0,0 Z" />
      <path id="leaf-2" d="M0,0 C-8,-10 -12,0 0,20 C12,0 8,-10 0,0 Z" />

      <!-- Flower blossom shape (simplified: fewer circles) -->
      <g id="blossom">
        <circle cx="0" cy="0" r="10" />
        <circle cx="14" cy="-8" r="11" />
        <circle cx="-5" cy="-20" r="11" />
        <circle cx="-14" cy="-5" r="10" />
        <circle cx="2" cy="-10" r="5" fill="#fcd34d" />
      </g>
    </defs>

    <!-- Weather Layer: Snow (Winter) -->
    @if (season === 'winter') {
      <g class="snow-layer">
        @for (flake of snowflakes; track $index) {
          <circle
            class="snowflake"
            [attr.cx]="flake.x"
            [attr.cy]="flake.y"
            [attr.r]="flake.size"
            [style.animation-duration]="flake.animDuration"
            [style.animation-delay]="flake.animDelay"
          />
        }
      </g>
    }

    <!-- Weather Layer: Rain (Autumn) -->
    @if (season === 'autumn') {
      <g class="rain-layer">
        @for (drop of raindrops; track $index) {
          <line
            class="raindrop"
            [attr.x1]="drop.x"
            [attr.y1]="drop.y"
            [attr.x2]="drop.x2"
            [attr.y2]="drop.y2"
            [style.animation-duration]="drop.animDuration"
            [style.animation-delay]="drop.animDelay"
          />
        }
      </g>
    }

    <!-- Recursive Branch Template -->
    <ng-template #branchTemplate let-node="branch">
      @if (node) {
        <g [style.transform]="node.transform">
          <g
            class="animated-branch"
            [style.animation-duration]="node.animDuration"
            [style.animation-delay]="node.animDelay"
          >
            <!-- Structural Line -->
            <line
              class="branch-path"
              x1="0"
              y1="0"
              x2="0"
              [attr.y2]="node.negLength"
              [attr.stroke-width]="node.width"
              stroke-linecap="round"
            />

            <!-- Children Branches -->
            @for (child of node.children; track $index) {
              <ng-container
                *ngTemplateOutlet="branchTemplate; context: { branch: child }"
              ></ng-container>
            }

            <!-- Leaves (Hidden in Winter) -->
            @if (season !== 'winter' && node.leaves.length > 0) {
              <g class="leaves" [class.autumn]="season === 'autumn'">
                @for (leaf of node.leaves; track $index) {
                  <g [style.transform]="leaf.transform">
                    <g class="leaf-group" [style.animation-delay]="leaf.animDelay">
                      <use [attr.href]="leaf.href" [attr.transform]="leaf.useTransform" />
                    </g>
                  </g>
                }
              </g>
            }

            <!-- Spring Flowers -->
            @if (season === 'spring' && node.flowers.length > 0) {
              <g class="flowers">
                @for (flower of node.flowers; track $index) {
                  <g [style.transform]="flower.transform">
                    <g class="flower-group" [style.animation-delay]="flower.animDelay">
                      <use
                        href="#blossom"
                        [attr.fill]="flower.color"
                        [attr.transform]="flower.useTransform"
                      />
                    </g>
                  </g>
                }
              </g>
            }

            <!-- Lanterns (Visible in Dark Mode) -->
            @if (node.lanterns.length > 0) {
              <g class="lanterns" [class.show-lanterns]="isDarkMode()">
                @for (lantern of node.lanterns; track $index) {
                  <g
                    class="lantern-group-windy"
                    [style.transform]="lantern.transform"
                    [style.animation-delay]="lantern.animDelay"
                  >
                    <g class="lantern-sway" [style.transform-origin]="'0px 0px'">
                      <!-- Simplified orbs: no blur filter for performance -->
                      <g [style.transform]="node.counterRotateTransform">
                        <circle cx="0" [attr.cy]="14" r="14" class="glow" />
                        <circle cx="0" [attr.cy]="14" r="8" class="core" />
                        <circle cx="0" [attr.cy]="14" r="4" fill="#fff" />
                      </g>
                    </g>
                  </g>
                }
              </g>
            }
          </g>
        </g>
      }
    </ng-template>

    <!-- Render Root Branches -->
    @for (rootNode of branches; track $index) {
      <ng-container
        *ngTemplateOutlet="branchTemplate; context: { branch: rootNode }"
      ></ng-container>
    }
  </svg>
}
