@if (!seasonService.disabled()) {
  <div class="season-switcher">
    <button
      type="button"
      class="season-nav-btn prev"
      (click)="previousSeason()"
      title="{{ 'SEASONS.PREVIOUS' | translate }}"
      aria-label="{{ 'SEASONS.PREVIOUS' | translate }}"
    >
      <lucide-icon [img]="ChevronLeftIcon" size="18"></lucide-icon>
    </button>

    <div class="season-display">
      <span class="season-emoji">{{ seasonEmoji() }}</span>
      <div class="season-text">
        <span class="season-name">{{ seasonNameKey() | translate }}</span>
        <span class="season-tagline">{{ seasonTaglineKey() | translate }}</span>
      </div>
      <span class="season-emoji">{{ seasonEmoji() }}</span>
    </div>

    <button
      type="button"
      class="season-nav-btn next"
      (click)="nextSeason()"
      title="{{ 'SEASONS.NEXT' | translate }}"
      aria-label="{{ 'SEASONS.NEXT' | translate }}"
    >
      <lucide-icon [img]="ChevronRightIcon" size="18"></lucide-icon>
    </button>
  </div>
}
