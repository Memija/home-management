    <script>
      if (
        window.location.hostname === 'home-management-be965.web.app' ||
        window.location.hostname === 'home-management-be965.firebaseapp.com'
      ) {
        window.location.replace(
          'https://home-management.dev' +
            window.location.pathname +
            window.location.search +
            window.location.hash,
        );
      }
      try {
        var storedTheme = localStorage.getItem('hm_theme');
        var isDark =
          storedTheme === 'dark' ||
          ((!storedTheme || storedTheme === 'system') &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        var storedMembers = localStorage.getItem('hm_household_members');
        var parsedMembers = storedMembers ? JSON.parse(storedMembers) : null;
        var memberCount =
          Array.isArray(parsedMembers) && parsedMembers.length > 0 ? parsedMembers.length : 2;
        document.documentElement.dataset.householdSize = String(memberCount);
      } catch (e) {}
    </script>
